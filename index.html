<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect — Gestion des réservations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#F3F6FD] text-[#0F1B3D]" style="font-family: 'Inter', system-ui, sans-serif;">

  <header class="border-b border-[#E1E8F5] bg-white">
    <div class="mx-auto flex max-w-6xl flex-col items-start gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <img src="img/busdirect-logo.svg" alt="BusDirect" class="h-10 w-auto">
      <div class="sm:text-right">
        <p class="text-lg font-bold text-[#0F1B3D]">Safi → Marrakech</p>
        <p class="text-sm text-[#5B6785]">Gestion des réservations</p>
      </div>
      <span class="rounded-full bg-[#E8EEFF] px-3 py-1 text-sm font-semibold text-[#1D4BFF]">80 DH / siège</span>
    </div>
  </header>
  <main class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-6 sm:px-6">
        <section class="w-full rounded-2xl border border-[#E1E8F5] bg-white p-4 sm:p-6">
      <h1 class="text-xl font-bold text-[#0F1B3D]">Plan du bus</h1>

      <ul class="mt-3 flex flex-wrap gap-x-5 gap-y-2 text-sm text-[#5B6785]">
        <li class="flex items-center gap-2">
          <span class="h-4 w-4 rounded border-2 border-[#1D4BFF] bg-white"></span>
          Libre
        </li>
        <li class="flex items-center gap-2">
          <span class="h-4 w-4 rounded border-2 border-[#1D4BFF] bg-[#1D4BFF]"></span>
          Occupé
        </li>
      </ul>

      <div class="mx-auto mt-5 w-full max-w-sm rounded-3xl border-2 border-[#DCE4F7] bg-[#F3F6FD] p-4">
        <p class="mb-4 border-b border-[#DCE4F7] pb-3 text-center text-xs font-medium tracking-widest text-[#5B6785]">AVANT DU BUS</p>
        <div class="flex flex-col gap-2">
  </main>
</body>
</html>
